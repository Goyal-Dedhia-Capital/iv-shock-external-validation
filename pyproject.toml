[project]
name = "ivshock-external-validation"
version = "0.1.0"
description = "Portable data contracts and preparation for H3/H5 IV-shock external validation"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.30,<2",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
