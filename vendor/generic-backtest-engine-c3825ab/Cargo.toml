[workspace]
members = [
  "crates/contracts",
  "crates/engine",
  "crates/research-process",
  "crates/test-support",
  "tools/repository-check",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Proprietary"
rust-version = "1.94"

[workspace.dependencies]
anyhow = "1.0"
backtest-contracts = { path = "crates/contracts" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
