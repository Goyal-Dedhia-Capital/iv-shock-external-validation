[package]
name = "exp046-r2-core-policy"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Proprietary"
publish = false

[dependencies]
backtest-contracts = { git = "https://github.com/Goyal-Dedhia-Capital/generic-backtest-engine.git", rev = "c3825ab856d4e480bd993c6c68a28ae4f69d602e" }
backtest-engine = { git = "https://github.com/Goyal-Dedhia-Capital/generic-backtest-engine.git", rev = "c3825ab856d4e480bd993c6c68a28ae4f69d602e" }
backtest-research-process = { git = "https://github.com/Goyal-Dedhia-Capital/generic-backtest-engine.git", rev = "c3825ab856d4e480bd993c6c68a28ae4f69d602e" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"

[[bin]]
name = "exp046-policy"
path = "src/main.rs"
