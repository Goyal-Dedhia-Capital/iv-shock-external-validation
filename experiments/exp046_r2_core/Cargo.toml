[package]
name = "exp046-r2-core-policy"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Proprietary"
publish = false

[dependencies]
backtest-contracts = { path = "../../vendor/generic-backtest-engine-c3825ab/crates/contracts" }
backtest-engine = { path = "../../vendor/generic-backtest-engine-c3825ab/crates/engine" }
backtest-research-process = { path = "../../vendor/generic-backtest-engine-c3825ab/crates/research-process" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
